<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Test</title>
</head>
<body>

<button id="share">シェアする</button>

<script>
document.getElementById("share").addEventListener("click", async () => {
  if (navigator.share) {
    try {
      await navigator.share({
        title: "シェアテスト",
        text: "シェア機能のテストです",
        url: location.href
      });
    } catch (error) {
      console.log(error);
    }
  } else {
    alert("この環境ではシェア機能を利用できません");
  }
});
</script>

</body>
</html>
